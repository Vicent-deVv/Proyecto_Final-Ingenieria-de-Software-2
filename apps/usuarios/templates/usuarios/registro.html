{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión - Registro</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body class="body-login"> <div class="contenedor-login">
        <div class="login-header">
            <img src="{% static 'img/bembos_logo.png' %}" alt="Bembos Logo" class="logo-login">
            <h2>Crear Cuenta Nueva</h2>
        </div>

        {% if error %}
            <div class="alerta-error">
                <span class="icono-alerta">⚠</span> {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'registro' %}" class="formulario-login">
            {% csrf_token %}
            
            <div class="grupo-input">
                <label for="username">Nombre de Usuario (ID):</label>
                <input type="text" id="username" name="username" class="input-login" placeholder="Ej: jvicente" required>
            </div>

            <div class="grupo-input">
                <label for="first_name">Nombre Completo:</label>
                <input type="text" id="first_name" name="first_name" class="input-login" placeholder="Ej: José Vicente" required>
            </div>

            <div class="grupo-input">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" class="input-login" placeholder="Ej: usuario@correo.com" required>
            </div>

            <div class="grupo-input">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" class="input-login" placeholder="Mínimo 8 caracteres" required>
            </div>

            <div class="grupo-input">
                <label for="password_confirm">Confirmar Contraseña:</label>
                <input type="password" id="password_confirm" name="password_confirm" class="input-login" placeholder="Repite tu contraseña" required>
            </div>

            <button type="submit" class="btn-ingresar" style="background-color: #4cb02a;">
                Registrarse
            </button>

            <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                ¿Ya tienes una cuenta? <a href="{% url 'login' %}" style="color: #00249c; font-weight: bold; text-decoration: none;">Inicia sesión aquí</a>
            </p>
        </form>
    </div>

</body>
</html>

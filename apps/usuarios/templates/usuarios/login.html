{% extends 'base.html' %}
{% block titulo_pantalla %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="bembos-card" style="max-width: 400px; margin: auto; margin-top: 50px;">
    <h2 style="text-align: center; color: #002FA7;">Bienvenido de vuelta</h2>
    
    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        
        <button type="submit" class="btn-submit" style="width: 100%; margin-top: 10px; font-size: 16px; background-color: #F3D05C; color: black;">Ingresar</button>
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'registro' %}" style="color: #4BA3E3; text-decoration: none; font-weight: bold;">¿Eres nuevo? Regístrate aquí</a>
    </div>
</div>
{% endblock %}

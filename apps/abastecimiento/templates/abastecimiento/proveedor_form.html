{% extends 'base.html' %}
{% block titulo_pantalla %}Gestión de Abastecimiento y Proveedores{% endblock %}

{% block content %}
<div class="bembos-card" style="max-width: 800px; margin: auto; padding: 0; overflow: hidden;">
    <div style="background-color: #F7FAFC; padding: 15px 20px; border-bottom: 1px solid #E2E8F0;">
        <h3 style="margin: 0; color: #1F2937;">{{ titulo_formulario|default:"Registrar Nuevo Proveedor" }}</h3>
    </div>
    
    <form method="POST" style="padding: 20px;">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center;">
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-weight: bold; font-size: 14px;">PROVEEDOR</label>
                <input type="text" name="proveedor" class="form-control" style="width: 60%;" required placeholder="Ej: San Fernando S.A." value="{{ proveedor.razon_social|default:'' }}">
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-weight: bold; font-size: 14px;">CONTACTO</label>
                <input type="text" name="contacto" class="form-control" style="width: 60%;" placeholder="Nombre del asesor" value="{{ proveedor.contacto|default:'' }}">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-weight: bold; font-size: 14px;">RUC</label>
                <input type="text" name="ruc" class="form-control" style="width: 60%;" required maxlength="11" placeholder="Ej: 20100100100" value="{{ proveedor.ruc|default:'' }}">
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-weight: bold; font-size: 14px;">CATEGORÍA</label>
                <select name="categoria" class="form-control" style="width: 60%;">
                    <option value="Cárnicos" {% if proveedor.categoria == 'Cárnicos' %}selected{% endif %}>Cárnicos</option>
                    <option value="Lácteos" {% if proveedor.categoria == 'Lácteos' %}selected{% endif %}>Lácteos</option>
                    <option value="Vegetales" {% if proveedor.categoria == 'Vegetales' %}selected{% endif %}>Vegetales</option>
                    <option value="Abarrotes" {% if proveedor.categoria == 'Abarrotes' %}selected{% endif %}>Abarrotes</option>
                </select>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-weight: bold; font-size: 14px;">CORREO ELECTRÓNICO</label>
                <input type="email" name="correo" class="form-control" style="width: 60%;" placeholder="ventas@empresa.com" value="{{ proveedor.correo|default:'' }}">
            </div>
            
            <div></div> 

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-weight: bold; font-size: 14px;">DIRECCIÓN FISCAL</label>
                <input type="text" name="direccion" class="form-control" style="width: 60%;" placeholder="Av. Principal 123" value="{{ proveedor.direccion|default:'' }}">
            </div>
            
            <div></div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button type="submit" class="btn-submit" style="background-color: #2563EB; color: white; border: none; padding: 10px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; margin-right: 15px;">
                Guardar ✔️
            </button>
            <a href="{% url 'proveedor_list' %}" class="btn-submit" style="background-color: #DC2626; color: white; padding: 10px 25px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 15px; display: inline-block;">
                Cancelar ❌
            </a>
        </div>
    </form>
</div>
{% endblock %}
